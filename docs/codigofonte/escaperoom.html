<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Cypherpunk - Escape Room</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

        body {
            background: #000;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .matrix-bg {
            background: linear-gradient(180deg, #000 0%, #0a0a0a 100%);
            position: relative;
        }

        .matrix-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 65, 0.03) 2px, rgba(0, 255, 65, 0.03) 4px);
            pointer-events: none;
        }

        .glitch {
            animation: glitch 3s infinite;
        }

        @keyframes glitch {

            0%,
            90%,
            100% {
                transform: translate(0);
            }

            91% {
                transform: translate(-2px, 2px);
            }

            92% {
                transform: translate(2px, -2px);
            }

            93% {
                transform: translate(-2px, -2px);
            }

            94% {
                transform: translate(2px, 2px);
            }
        }

        .scanline {
            position: relative;
            overflow: hidden;
        }

        .scanline::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(0, 255, 65, 0.5);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(100vh);
            }
        }

        .terminal {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.5), inset 0 0 50px rgba(0, 255, 65, 0.1);
        }

        .terminal-text {
            color: #00ff41;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.8);
        }

        .surveillance-text {
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        .btn-cyber {
            background: linear-gradient(90deg, #00ff41 0%, #00cc33 100%);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
            transition: all 0.3s;
        }

        .btn-cyber:hover:not(:disabled) {
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.8);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(90deg, #ff0000 0%, #cc0000 100%);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .station-card {
            background: rgba(0, 20, 0, 0.8);
            border: 2px solid #00ff41;
            transition: all 0.3s;
        }

        .station-card:hover {
            border-color: #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.6);
            transform: translateY(-5px);
        }

        .station-locked {
            background: rgba(50, 0, 0, 0.8);
            border: 2px solid #666;
            opacity: 0.6;
        }

        .station-completed {
            background: rgba(0, 50, 0, 0.9);
            border: 2px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
        }

        .code-display {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: #00ff41;
            text-shadow: 0 0 15px rgba(0, 255, 65, 0.8);
        }

        .timer-urgent {
            animation: pulse-red 1s ease-in-out infinite;
        }

        @keyframes pulse-red {

            0%,
            100% {
                color: #ff0000;
                text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            }

            50% {
                color: #ff6666;
                text-shadow: 0 0 30px rgba(255, 0, 0, 1);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .camera-icon {
            animation: blink-camera 2s ease-in-out infinite;
        }

        @keyframes blink-camera {

            0%,
            50%,
            100% {
                opacity: 1;
            }

            25%,
            75% {
                opacity: 0.3;
            }
        }

        /* CORREÇÃO DO BUG: Inputs e textareas com fundo escuro e texto verde */
        input[type="text"],
        input[type="password"],
        input[type="number"],
        textarea {
            background: rgba(0, 20, 0, 0.9) !important;
            border: 2px solid #00ff41 !important;
            color: #00ff41 !important;
            font-family: 'Share Tech Mono', monospace !important;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(0, 255, 65, 0.5) !important;
        }

        input:focus,
        textarea:focus {
            outline: none !important;
            border-color: #00ff41 !important;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5) !important;
        }

        .bitcoin-symbol {
            animation: float-coin 3s ease-in-out infinite;
        }

        @keyframes float-coin {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        .difficulty-badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .penalty-flash {
            animation: flash-red 0.5s ease-in-out;
        }

        @keyframes flash-red {

            0%,
            100% {
                background: transparent;
            }

            50% {
                background: rgba(255, 0, 0, 0.3);
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DIFFICULTIES = {
            easy: {
                name: 'Fácil',
                time: 5400, // 90 minutes
                hintsAfter: 1, // Show hints after 1 wrong attempt
                timePenalty: 0, // No time penalty
                color: 'bg-green-600',
                description: '90min • Dicas rápidas • Sem penalidade'
            },
            medium: {
                name: 'Médio',
                time: 3600, // 60 minutes
                hintsAfter: 2, // Show hints after 2 wrong attempts
                timePenalty: 300, // -5 minutes penalty
                color: 'bg-yellow-600',
                description: '60min • Dicas após 2 erros • -5min por erro'
            },
            hard: {
                name: 'Difícil',
                time: 2700, // 45 minutes
                hintsAfter: 3, // Show hints after 3 wrong attempts
                timePenalty: 600, // -10 minutes penalty
                color: 'bg-red-600',
                description: '45min • Dicas após 3 erros • -10min por erro'
            }
        };

        const CHALLENGES = [
            {
                id: 1,
                name: "The Cypherpunk Manifesto",
                icon: "📜",
                description: "Decifre a mensagem de Eric Hughes",
                code: "PRIVACY"
            },
            {
                id: 2,
                name: "Decrypt the Message",
                icon: "🔐",
                description: "Quebra a Cifra de César",
                code: "SHA"
            },
            {
                id: 3,
                name: "Find the Private Key",
                icon: "🔑",
                description: "Encontre a chave secreta",
                code: "256"
            },
            {
                id: 4,
                name: "The Satoshi Riddle",
                icon: "🎭",
                description: "Quem realmente é Satoshi?",
                code: "SATOSHI"
            },
            {
                id: 5,
                name: "Proof of Work",
                icon: "⛏️",
                description: "Entenda a mineração",
                code: "BLOCK"
            },
            {
                id: 6,
                name: "Break the Surveillance",
                icon: "📹",
                description: "Desative a vigilância",
                code: "CHAIN"
            },
            {
                id: 7,
                name: "The Double Spend Problem",
                icon: "💰",
                description: "Resolva o problema Byzantine",
                code: "CONSENSUS"
            },
            {
                id: 8,
                name: "The Genesis Block",
                icon: "⛓️",
                description: "Acesse o bloco gênesis",
                code: "FREEDOM",
                isFinal: true
            }
        ];

        const App = () => {
            const [gameState, setGameState] = useState('intro'); // intro, difficulty, playing, won, lost
            const [difficulty, setDifficulty] = useState(null);
            const [timeRemaining, setTimeRemaining] = useState(3600);
            const [completedChallenges, setCompletedChallenges] = useState([]);
            const [currentChallenge, setCurrentChallenge] = useState(null);
            const [collectedCodes, setCollectedCodes] = useState([]);
            const [showIntro, setShowIntro] = useState(true);
            const [totalErrors, setTotalErrors] = useState(0);
            const [score, setScore] = useState(0);

            useEffect(() => {
                if (gameState === 'playing' && timeRemaining > 0) {
                    const timer = setInterval(() => {
                        setTimeRemaining(prev => {
                            if (prev <= 1) {
                                setGameState('lost');
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                    return () => clearInterval(timer);
                }
            }, [gameState, timeRemaining]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const selectDifficulty = (diffKey) => {
                setDifficulty(diffKey);
                setTimeRemaining(DIFFICULTIES[diffKey].time);
                setGameState('playing');
            };

            const applyTimePenalty = () => {
                if (difficulty && DIFFICULTIES[difficulty].timePenalty > 0) {
                    const penalty = DIFFICULTIES[difficulty].timePenalty;
                    setTimeRemaining(prev => Math.max(0, prev - penalty));
                    return penalty;
                }
                return 0;
            };

            const completeChallenge = (challengeId, code, errors) => {
                setCompletedChallenges([...completedChallenges, challengeId]);
                setCollectedCodes([...collectedCodes, code]);
                setCurrentChallenge(null);

                // Calculate score
                const baseScore = 1000;
                const errorPenalty = errors * 100;
                const timePenalty = difficulty === 'hard' ? 200 : difficulty === 'medium' ? 100 : 0;
                const earnedScore = Math.max(100, baseScore - errorPenalty - timePenalty);
                setScore(prev => prev + earnedScore);
            };

            const completeGame = () => {
                // Bonus por tempo restante
                const timeBonus = Math.floor(timeRemaining / 60) * 50;
                setScore(prev => prev + timeBonus);
                setGameState('won');
            };

            // Intro Screen
            if (showIntro && gameState === 'intro') {
                return <IntroScreen onContinue={() => {
                    setShowIntro(false);
                    setGameState('difficulty');
                }} />;
            }

            // Difficulty Selection
            if (gameState === 'difficulty') {
                return (
                    <div className="matrix-bg min-h-screen scanline flex items-center justify-center p-4">
                        <div className="terminal rounded-lg p-8 md:p-12 max-w-4xl w-full fade-in">
                            <h2 className="text-4xl font-bold terminal-text text-center mb-8 orbitron glitch">
                                ⚙️ SELECIONE A DIFICULDADE
                            </h2>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                {Object.entries(DIFFICULTIES).map(([key, diff]) => (
                                    <button
                                        key={key}
                                        onClick={() => selectDifficulty(key)}
                                        className="terminal rounded-lg p-6 hover:scale-105 transition-all cursor-pointer"
                                    >
                                        <div className={`difficulty-badge ${diff.color} text-white inline-block mb-4`}>
                                            {diff.name}
                                        </div>
                                        <h3 className="text-2xl font-bold terminal-text mb-3 orbitron">
                                            {key === 'easy' ? '🟢' : key === 'medium' ? '🟡' : '🔴'}
                                        </h3>
                                        <p className="text-green-400 text-sm leading-relaxed">
                                            {diff.description}
                                        </p>
                                    </button>
                                ))}
                            </div>

                            <div className="terminal-text text-sm text-center opacity-75">
                                <p>💡 Dica: Comece com Fácil se é sua primeira vez!</p>
                            </div>
                        </div>
                    </div>
                );
            }

            // Playing Screen
            if (gameState === 'playing') {
                return (
                    <div className="matrix-bg min-h-screen scanline">
                        <div className="container mx-auto px-4 py-6">
                            {/* Header with Timer */}
                            <div className="terminal rounded-lg p-6 mb-6 fade-in">
                                <div className="flex flex-wrap justify-between items-center gap-4">
                                    <div>
                                        <h1 className="text-2xl md:text-3xl font-bold orbitron terminal-text glitch">
                                            🔐 OPERATION CYPHERPUNK
                                        </h1>
                                        <div className="flex items-center gap-3 mt-2">
                                            <span className={`difficulty-badge ${DIFFICULTIES[difficulty].color} text-white`}>
                                                {DIFFICULTIES[difficulty].name}
                                            </span>
                                            <span className="terminal-text text-sm">
                                                {completedChallenges.length}/{CHALLENGES.length} Estações
                                            </span>
                                            <span className="terminal-text text-sm">
                                                🏆 {score} pts
                                            </span>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-sm terminal-text mb-1">TEMPO RESTANTE</div>
                                        <div className={`text-4xl md:text-5xl font-bold orbitron ${timeRemaining < 300 ? 'timer-urgent' : 'terminal-text'}`}>
                                            {formatTime(timeRemaining)}
                                        </div>
                                        {totalErrors > 0 && (
                                            <div className="text-xs text-red-400 mt-1">
                                                ⚠️ {totalErrors} erro(s)
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Progress Bar */}
                                <div className="mt-4 bg-gray-900 h-4 rounded-full overflow-hidden">
                                    <div
                                        className="h-full bg-gradient-to-r from-green-500 to-emerald-500 transition-all duration-500"
                                        style={{ width: `${(completedChallenges.length / CHALLENGES.length) * 100}%` }}
                                    ></div>
                                </div>
                            </div>

                            {/* Collected Codes Display */}
                            {collectedCodes.length > 0 && (
                                <div className="terminal rounded-lg p-6 mb-6 fade-in">
                                    <h3 className="text-xl font-bold terminal-text mb-4 orbitron">📟 CÓDIGOS COLETADOS</h3>
                                    <div className="flex flex-wrap gap-4">
                                        {collectedCodes.map((code, idx) => (
                                            <div key={idx} className="code-display bg-black/50 px-6 py-3 rounded border-2 border-green-500">
                                                {code}
                                            </div>
                                        ))}
                                        {[...Array(CHALLENGES.length - collectedCodes.length)].map((_, idx) => (
                                            <div key={`empty-${idx}`} className="code-display bg-black/50 px-6 py-3 rounded border-2 border-gray-700 opacity-30">
                                                ???
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Challenges Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                {CHALLENGES.map(challenge => {
                                    const isCompleted = completedChallenges.includes(challenge.id);
                                    const isLocked = challenge.isFinal && completedChallenges.length < CHALLENGES.length - 1;
                                    const isAvailable = !isCompleted && !isLocked;

                                    return (
                                        <div
                                            key={challenge.id}
                                            className={`
                                                rounded-lg p-6 cursor-pointer transition-all
                                                ${isCompleted ? 'station-completed' : isLocked ? 'station-locked' : 'station-card'}
                                            `}
                                            onClick={() => isAvailable && setCurrentChallenge(challenge)}
                                        >
                                            <div className="text-4xl mb-3 text-center">
                                                {isCompleted ? '✅' : isLocked ? '🔒' : challenge.icon}
                                            </div>
                                            <h3 className="text-lg font-bold terminal-text text-center mb-2 orbitron leading-tight">
                                                {challenge.name}
                                            </h3>
                                            <p className="text-green-400 text-center text-xs">
                                                {isCompleted ? `✓ ${challenge.code}` :
                                                    isLocked ? '⚠️ BLOQUEADO' :
                                                        challenge.description}
                                            </p>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Challenge Modal */}
                            {currentChallenge && (
                                <ChallengeModal
                                    challenge={currentChallenge}
                                    difficulty={difficulty}
                                    onComplete={(code, errors) => {
                                        setTotalErrors(prev => prev + errors);
                                        if (currentChallenge.isFinal) {
                                            completeGame();
                                        } else {
                                            completeChallenge(currentChallenge.id, code, errors);
                                        }
                                    }}
                                    onClose={() => setCurrentChallenge(null)}
                                    collectedCodes={collectedCodes}
                                    onTimePenalty={applyTimePenalty}
                                />
                            )}
                        </div>
                    </div>
                );
            }

            // Win Screen
            if (gameState === 'won') {
                return <WinScreen
                    timeUsed={DIFFICULTIES[difficulty].time - timeRemaining}
                    difficulty={difficulty}
                    score={score}
                    errors={totalErrors}
                />;
            }

            // Lost Screen
            if (gameState === 'lost') {
                return <LostScreen
                    onRestart={() => {
                        setGameState('intro');
                        setShowIntro(true);
                        setDifficulty(null);
                        setTimeRemaining(3600);
                        setCompletedChallenges([]);
                        setCollectedCodes([]);
                        setTotalErrors(0);
                        setScore(0);
                    }}
                    completedChallenges={completedChallenges.length}
                    totalChallenges={CHALLENGES.length}
                />;
            }

            return null;
        };

        // Intro Screen Component
        const IntroScreen = ({ onContinue }) => {
            const [stage, setStage] = useState(0);

            useEffect(() => {
                const timers = [
                    setTimeout(() => setStage(1), 2000),
                    setTimeout(() => setStage(2), 4000),
                    setTimeout(() => setStage(3), 6000),
                    setTimeout(() => setStage(4), 8000)
                ];
                return () => timers.forEach(t => clearTimeout(t));
            }, []);

            return (
                <div className="matrix-bg min-h-screen scanline flex items-center justify-center p-4">
                    <div className="terminal rounded-lg p-8 md:p-12 max-w-4xl w-full fade-in">
                        <div className="text-center">
                            <div className="text-6xl mb-6 camera-icon">📹</div>
                            <h1 className="text-4xl md:text-6xl font-bold surveillance-text mb-4 orbitron glitch">
                                BIG BROTHER IS WATCHING
                            </h1>

                            {stage >= 1 && (
                                <div className="terminal-text text-xl mb-6 fade-in">
                                    <p className="mb-2">📅 Ano: 2009</p>
                                    <p>📍 Lugar: Um bunker secreto</p>
                                </div>
                            )}

                            {stage >= 2 && (
                                <div className="terminal-text text-lg mb-6 text-left max-w-2xl mx-auto fade-in">
                                    <p className="mb-4">
                                        Você faz parte dos <span className="font-bold text-green-400">CYPHERPUNKS</span> -
                                        um grupo clandestino que luta pela privacidade desde os anos 90.
                                    </p>
                                    <p className="mb-4 surveillance-text font-bold">
                                        🚨 O GOVERNO descobriu sua localização!
                                    </p>
                                    <p>
                                        Você tem <span className="font-bold">tempo limitado</span> até eles chegarem.
                                    </p>
                                </div>
                            )}

                            {stage >= 3 && (
                                <div className="terminal-text mb-8 text-left max-w-2xl mx-auto fade-in">
                                    <p className="mb-3 font-bold text-green-400 text-xl">🎯 MISSÃO:</p>
                                    <ol className="list-decimal list-inside space-y-2 text-sm md:text-base">
                                        <li>Decifrar o Manifesto Cypherpunk</li>
                                        <li>Quebrar a criptografia clássica</li>
                                        <li>Encontrar a chave privada de Satoshi</li>
                                        <li>Resolver o enigma da identidade</li>
                                        <li>Entender Proof of Work</li>
                                        <li>Desativar o sistema de vigilância</li>
                                        <li>Resolver o Double Spend Problem</li>
                                        <li>Acessar o Genesis Block</li>
                                    </ol>
                                    <p className="mt-4 text-yellow-400">
                                        💡 Cada desafio revela parte da história de como Bitcoin mudou o mundo.
                                    </p>
                                </div>
                            )}

                            {stage >= 4 && (
                                <div className="fade-in">
                                    <p className="terminal-text text-lg mb-6">
                                        ⏱️ O relógio está correndo... você está pronto?
                                    </p>
                                    <button
                                        onClick={onContinue}
                                        className="btn-cyber text-black px-8 py-4 rounded-lg font-bold text-xl orbitron"
                                    >
                                        ▶ ACEITAR MISSÃO
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // Challenge Modal Component
        const ChallengeModal = ({ challenge, difficulty, onComplete, onClose, collectedCodes, onTimePenalty }) => {
            const [answer, setAnswer] = useState('');
            const [hint, setHint] = useState('');
            const [error, setError] = useState('');
            const [attempts, setAttempts] = useState(0);
            const [lockCode, setLockCode] = useState(['', '', '', '']);
            const [showPenalty, setShowPenalty] = useState(false);

            const diffSettings = DIFFICULTIES[difficulty];

            const handleError = (errorMsg) => {
                setAttempts(prev => prev + 1);
                const newAttempts = attempts + 1;
                setError(errorMsg);

                // Apply time penalty on second error
                if (newAttempts >= 2 && diffSettings.timePenalty > 0) {
                    const penalty = onTimePenalty();
                    if (penalty > 0) {
                        setShowPenalty(true);
                        setError(`${errorMsg} ⏱️ -${penalty / 60} minutos!`);
                        setTimeout(() => setShowPenalty(false), 1000);
                    }
                }

                // Show hints after certain attempts
                if (newAttempts >= diffSettings.hintsAfter) {
                    setHint(getHint(challenge.id, newAttempts));
                }
            };

            const getHint = (challengeId, attemptCount) => {
                const hints = {
                    1: [
                        '💡 Leia o texto em voz alta, soa familiar?',
                        '💡 A resposta está na própria frase: "é necessária para..."',
                        '💡 Palavra-chave: PRIVACIDADE (ou PRIVACY em inglês)'
                    ],
                    2: [
                        '💡 Cifra de César: cada letra foi deslocada 5 posições',
                        '💡 W → R, Y → T, J → E... continue o padrão!',
                        '💡 A resposta começa com "We require..."'
                    ],
                    3: [
                        '💡 Pense nas datas importantes: Pizza Day é 22/05',
                        '💡 Genesis Block foi em 03/01/2009',
                        '💡 Formato: DD-MM-AA-AA (dia/mês do Pizza + últimos 2 dígitos do ano)'
                    ],
                    4: [
                        '💡 Satoshi não é uma pessoa específica',
                        '💡 Pense filosoficamente: quem controla Bitcoin?',
                        '💡 Respostas válidas: "nobody", "anonymous", "we all" ou em português'
                    ],
                    5: [
                        '💡 SHA-256 gera um hash. Qual número deve estar no hash?',
                        '💡 Bitcoin requer que o hash comece com zeros',
                        '💡 Você precisa de 4 zeros à esquerda: 0000...'

                                className="btn-cyber text-black px-6 py-3 rounded-lg font-bold w-full text-lg orbitron disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {challenge.isFinal ? '🔓 ACESSAR GENESIS BLOCK' : '✓ VERIFICAR RESPOSTA'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Win Screen Component
        const WinScreen = ({ timeUsed, difficulty, score, errors }) => {
            const minutes = Math.floor(timeUsed / 60);
            const seconds = timeUsed % 60;
            const diffName = DIFFICULTIES[difficulty].name;

            let rank = 'Cypherpunk Iniciante';
            if (difficulty === 'hard' && errors < 5) rank = 'Cypherpunk Master';

            return (

                                    <p className="text-2xl font-bold terminal-text">{minutes}:{seconds.toString().padStart(2, '0')}</p>

                                <div className="bg-black/70 p-4 rounded border border-yellow-500">
                                    <p className="text-yellow-400 text-sm mb-1">Dificuldade</p>
                                    <p className="text-2xl font-bold terminal-text">{diffName}</p>
                                </div>
                                <div className="bg-black/70 p-4 rounded border border-blue-500">
                                    <p className="text-blue-400 text-sm mb-1">Pontos</p>
                                    <p className="text-2xl font-bold terminal-text">{score}</p>
                                </div>
                                <div className="bg-black/70 p-4 rounded border border-red-500">
                                    <p className="text-red-400 text-sm mb-1">Erros</p>
                                    <p className="text-2xl font-bold terminal-text">{errors}</p>
                                </div>
                            </div>

                            <div className="bg-black/70 p-8 rounded border-2 border-green-500 mb-8">
                                <p className="terminal-text text-lg leading-relaxed mb-6">
                                    🎉 <strong>Parabéns, Cypherpunk!</strong>
                                </p>
                                <div className="terminal-text text-left space-y-4 max-w-2xl mx-auto">
                                    <p>Você não apenas escapou - você <strong>COMPREENDEU</strong> a essência.</p>
                                    <p>Bitcoin não é sobre dinheiro. É sobre <strong className="text-green-400">LIBERDADE</strong>.</p>
                                    <p>É sobre <strong>privacidade</strong> numa era de vigilância em massa.</p>
                                    <p>É sobre <strong>descentralização</strong> quando o poder está concentrado.</p>
                                    <p>É sobre <strong>resistência</strong> quando o sistema financeiro falha.</p>
                                    <p className="text-yellow-400 font-bold mt-6">
                                        Satoshi nos deu a ferramenta em 2009.<br />
                                        Os Cypherpunks plantaram a semente nos anos 90.<br />
                                        Agora, em 2025, cabe a NÓS usar essa tecnologia com sabedoria.
                                    </p>
                                </div>
                            </div>

                            <div className="mb-8">
                                <div className="text-6xl mb-4">🏆</div>
                                <div className="inline-block bg-gradient-to-r from-yellow-500 to-orange-500 text-black px-8 py-4 rounded-lg font-bold text-xl orbitron mb-4">
                                    🎖️ {rank.toUpperCase()}
                                </div>
                                <p className="text-green-400 text-sm">Badge desbloqueado!</p>
                            </div>

                            <div className="terminal-text text-sm opacity-75 mb-8">
                                <blockquote className="italic border-l-4 border-green-500 pl-4 mb-3">
                                    "Privacy is necessary for an open society in the electronic age."
                                </blockquote>
                                <p>- Eric Hughes, Cypherpunk Manifesto, 1993</p>
                                <blockquote className="italic border-l-4 border-yellow-500 pl-4 mt-4 mb-3">
                                    "The Times 03/Jan/2009 Chancellor on brink of second bailout for banks"
                                </blockquote>
                                <p>- Satoshi Nakamoto, Genesis Block, 2009</p>
                            </div>

                            <button
                                onClick={() => window.location.reload()}
                                className="btn-cyber text-black px-8 py-4 rounded-lg font-bold text-lg orbitron"
                            >
                                🔄 JOGAR NOVAMENTE
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Lost Screen Component
        const LostScreen = ({ onRestart, completedChallenges, totalChallenges }) => {
            return (
                <div className="matrix-bg min-h-screen scanline flex items-center justify-center p-4">
                    <div className="terminal rounded-lg p-8 md:p-12 max-w-4xl w-full fade-in">
                        <div className="text-center">
                            <div className="text-8xl mb-6 camera-icon">🚨</div>
                            <h1 className="text-4xl md:text-6xl font-bold surveillance-text mb-4 orbitron glitch">
                                TEMPO ESGOTADO
                            </h1>
                            <p className="text-2xl terminal-text mb-8">

                            </p>

                            <div className="bg-red-900/30 p-8 rounded border-2 border-red-500 mb-8">
                                <p className="text-red-400 text-lg mb-4">
                                    A vigilância venceu desta vez.
                                </p>
                                <div className="terminal-text mb-4">
                                    <p>Você completou {completedChallenges} de {totalChallenges} estações.</p>
                                </div>
                                <p className="terminal-text">
                                    Mas a luta pela privacidade continua...<br />
                                    Os Cypherpunks <strong>NUNCA</strong> desistem.
                                </p>
                            </div>

                            <div className="terminal-text text-sm opacity-75 mb-8">
                                <blockquote className="italic border-l-4 border-red-500 pl-4 mb-3">
                                    "We must defend our own privacy if we expect to have any."
                                </blockquote>
                                <p>- Eric Hughes</p>
                            </div>

                            <button
                                onClick={onRestart}
                                className="btn-cyber text-black px-8 py-4 rounded-lg font-bold text-lg orbitron"
                            >
                                🔄 TENTAR NOVAMENTE

                    </div>

        };

        ReactDOM.render(<App />, document.getElementById('root'));
